{% load ethio %}
<div>
    <label for="{{ field.id_for_label }}" class="mb-1 block text-sm font-medium text-stone-700">
        {{ field.label }}{% if field.field.required %} *{% endif %}
    </label>
    {{ field|add_class:"w-full rounded-md border border-stone-300 px-3 py-2 text-sm focus:border-emerald-600 focus:ring-emerald-600" }}
    {% if field.help_text %}<p class="mt-1 text-xs text-stone-500">{{ field.help_text }}</p>{% endif %}
    {% for error in field.errors %}<p class="mt-1 text-sm text-red-700">{{ error }}</p>{% endfor %}
</div>
