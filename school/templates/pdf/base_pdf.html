{% load static %}
<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}የሰንበት ትምህርት ቤት{% endblock %}</title>
    <style>
        @page {
            size: A4 landscape;
            margin: 1.2cm;
            @bottom-center {
                content: "ገጽ " counter(page) " / " counter(pages);
                font-family: "Noto Sans Ethiopic", sans-serif;
                font-size: 9px;
                color: #666;
            }
        }

        * { box-sizing: border-box; }

        body {
            font-family: "Noto Sans Ethiopic", sans-serif;
            font-size: 11px;
            color: #1c1917;
            margin: 0;
        }

        h1 {
            font-size: 16px;
            margin: 0 0 2px 0;
            color: #065f46;
        }

        .sub {
            font-size: 10px;
            color: #57534e;
            margin: 0 0 14px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #d6d3d1;
            padding: 3px 5px;
            text-align: center;
        }

        th {
            background: #f5f5f4;
            font-weight: 600;
        }

        td.name, th.name {
            text-align: left; 
        }

        tr.rank-1, tr.rank-2, tr.rank-3 {
            background: #fef9c3;
            font-weight: 600;
        }

        .footer-note {
            margin-top: 10px;
            font-size: 9px;
            color: #78716c;
        }
    </style>
    {% block extra_style %}{% endblock %}
</head>
<body>
    {% block body %}{% endblock %}
</body>
</html>
