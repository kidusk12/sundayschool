{% extends "base.html" %} {% block title %}ዳሽቦርድ · የሰንበት ትምህርት ቤት{% endblock %}
{% block content %}
<h1 class="mb-6 text-2xl font-semibold text-emerald-900">ዳሽቦርድ</h1>

<div class="grid gap-4 sm:grid-cols-3">
  <a
    href="{% url 'school:class_list' %}"
    class="rounded-md border border-stone-200 bg-white p-4 hover:border-emerald-600"
  >
    <p class="text-sm text-stone-500">ንቁ ክፍሎች</p>
    <p class="mt-1 text-3xl font-semibold text-stone-900">{{ class_count }}</p>
  </a>

  <div class="rounded-md border border-stone-200 bg-white p-4">
    <p class="text-sm text-stone-500">ጠቅላላ ተማሪዎች</p>
    <p class="mt-1 text-3xl font-semibold text-stone-900">
      {{ student_count }}
    </p>
  </div>

  <a
    href="{% url 'school:removal_pending_list' %}"
    class="rounded-md border p-4 hover:border-emerald-600 {% if pending_removal_count %}border-amber-300 bg-amber-50{% else %}border-stone-200 bg-white{% endif %}"
  >
    <p class="text-sm text-stone-500">በመጠባበቅ ላይ ያሉ የማስወገድ ጥያቄዎች</p>
    <p class="mt-1 text-3xl font-semibold text-stone-900">
      {{ pending_removal_count }}
    </p>
  </a>
</div>

<div class="mt-6 flex flex-wrap gap-3">
  <a
    href="{% url 'school:student_register' %}"
    class="rounded-md bg-emerald-800 px-4 py-2 text-sm font-medium text-white hover:bg-emerald-900"
  >
    ተማሪ ይመዝግቡ
  </a>
  <a
    href="{% url 'school:account_create' %}"
    class="rounded-md border border-stone-300 px-4 py-2 text-sm text-stone-700 hover:bg-stone-50"
  >
    አዲስ አካውንት ይፍጠሩ
  </a>
</div>
{% endblock %}
